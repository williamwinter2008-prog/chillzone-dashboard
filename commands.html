<header>

<div>

<h1>Commands</h1>

<p>Enable or disable bot commands.</p>

</div>

<div>

<button id="theme-toggle">🌙</button>

</div>

</header>

<div class="panel">

<h2>Moderation Commands</h2>

<div class="setting">
<span>Ban</span>

<label class="switch">
<input type="checkbox" checked>
<span class="slider"></span>
</label>
</div>

<div class="setting">
<span>Kick</span>

<label class="switch">
<input type="checkbox" checked>
<span class="slider"></span>
</label>
</div>

<div class="setting">
<span>Mute</span>

<label class="switch">
<input type="checkbox" checked>
<span class="slider"></span>
</label>
</div>

<div class="setting">
<span>Warn</span>

<label class="switch">
<input type="checkbox" checked>
<span class="slider"></span>
</label>
</div>

<button class="save-btn">
Save Changes
</button>

</div>

<div class="panel">

<h2>Fun Commands</h2>

<div class="setting">
<span>8ball</span>

<label class="switch">
<input type="checkbox" checked>
<span class="slider"></span>
</label>
</div>

<div class="setting">
<span>Meme</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<div class="setting">
<span>Joke</span>

<label class="switch">
<input type="checkbox" checked>
<span class="slider"></span>
</label>
</div>

Save Changes
</button>

</div>
