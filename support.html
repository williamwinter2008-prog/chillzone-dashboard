<section class="hero">

<h1>Support Centre</h1>

<p>
Need help? Fill out the form below and we'll get back to you.
</p>

<div class="card" style="max-width:700px;margin:auto;">

<form>

<label>Discord Username</label><br><br>

<input type="text" placeholder="ExampleUser#1234" required><br><br>

<label>Email</label><br><br>

<input type="email" placeholder="you@example.com" required><br><br>

<label>Subject</label><br><br>

<input type="text" placeholder="What do you need help with?" required><br><br>

<label>Message</label><br><br>

<textarea rows="8" placeholder="Describe your issue..." required></textarea><br><br>

<button class="invite" type="submit">
Submit Ticket
</button>

</form>

</div>

</section>

<script src="script.js"></script>
